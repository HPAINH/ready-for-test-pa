<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тренажёр теста Авито</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap&subset=cyrillic">
<style>
/* Layout: a working desk — slim top nav, one wide work surface per view, Hirety-style two-pane question cards */
:root {
  --paper: #EEF2F4;
  --card: #FFFFFF;
  --ink: #13212B;
  --muted: #5A6B77;
  --line: #D3DCE2;
  --accent: #0E6B58;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFE9;
  --warn: #A86512;
  --good: #1D7F47;
  --good-soft: #DDF2E5;
  --bad: #B83A32;
  --bad-soft: #F8E1DE;
  --mid: #A86512;
  --mid-soft: #F6EAD6;
  --code-bg: #F3F6F8;
  --f-display: 'Unbounded', 'Manrope', system-ui, sans-serif;
  --f-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1418; --card: #151E24; --ink: #E3EBF0; --muted: #8FA1AD; --line: #27343C;
    --accent: #3BC3A0; --accent-ink: #062019; --accent-soft: #143A31; --warn: #E2A452;
    --good: #4CC983; --good-soft: #15352A; --bad: #F07B70; --bad-soft: #3D1F1D; --mid: #E2A452; --mid-soft: #3A2C17; --code-bg: #10181D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1418; --card: #151E24; --ink: #E3EBF0; --muted: #8FA1AD; --line: #27343C;
  --accent: #3BC3A0; --accent-ink: #062019; --accent-soft: #143A31; --warn: #E2A452;
  --good: #4CC983; --good-soft: #15352A; --bad: #F07B70; --bad-soft: #3D1F1D; --mid: #E2A452; --mid-soft: #3A2C17; --code-bg: #10181D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.shell { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
header.top .shell { display: flex; align-items: center; gap: 18px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand .dot { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-family: var(--f-mono); font-size: 11px; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.nav button { font: 600 14px var(--f-body); color: var(--muted); background: none; border: 0; padding: 8px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.nav button:hover { color: var(--ink); background: var(--paper); }
.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
main { padding-block: 24px 64px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; letter-spacing: -0.02em; }
h2 { font-family: var(--f-display); font-weight: 500; font-size: 21px; letter-spacing: -0.01em; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
.eyebrow { font: 600 12px var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
.lead { color: var(--muted); font-size: 16px; max-width: 64ch; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); }
.note { color: var(--muted); font-size: 14px; max-width: 80ch; }
.row { display: flex; align-items: center; }
.gap { gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.sec { margin: 34px 0 14px; }
.btn { font: 600 14px var(--f-body); border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 9px 16px; border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 11px; font-size: 13px; }
.btn.big { padding: 13px 26px; font-size: 16px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link.danger { color: var(--bad); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pill { font: 600 11px var(--f-mono); padding: 2px 8px; border-radius: 99px; white-space: nowrap; background: var(--paper); color: var(--muted); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.mid { background: var(--mid-soft); color: var(--mid); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }

/* plan */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: end; }
.hero > div:first-child { display: flex; flex-direction: column; gap: 14px; }
.countdown { display: grid; gap: 10px; }
.cd { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; display: flex; align-items: baseline; gap: 14px; }
.cd .num { font: 700 30px var(--f-display); font-variant-numeric: tabular-nums; min-width: 2.6ch; color: var(--accent); }
.cd .lbl { color: var(--muted); font-size: 14px; }
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.topic { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; font: inherit; color: inherit; }
.topic:hover { border-color: var(--accent); }
.t-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.t-name { font-weight: 700; }
.t-meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { display: block; height: 6px; background: var(--paper); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--muted); border-radius: 99px; }
.bar > span.good { background: var(--good); } .bar > span.mid { background: var(--mid); } .bar > span.bad { background: var(--bad); }
.topics + .note { margin-top: 10px; }
.days { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.day { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; align-items: start; }
.day.done { opacity: 0.62; }
.day.done .d-title { text-decoration: line-through; text-decoration-color: var(--muted); }
.d-date { font: 600 13px var(--f-mono); color: var(--accent); padding-top: 2px; }
.d-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.d-title { font-weight: 700; font-size: 16px; }
.d-goal { color: var(--muted); font-size: 14px; }
.d-topics { display: flex; gap: 6px; flex-wrap: wrap; }
.check { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.reset { margin-top: 30px; font-size: 13px; color: var(--muted); }
.tablewrap { overflow-x: auto; max-width: 100%; }
table.data { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; background: var(--card); }
table.data th, table.data td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data th { font: 600 12px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.barcell { width: 40%; min-width: 120px; }

/* theory / split views */
.split { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; align-items: start; margin-top: 16px; }
.side { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); max-height: calc(100vh - 100px); overflow-y: auto; }
.side-item { display: flex; justify-content: space-between; gap: 8px; align-items: center; text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: 8px; cursor: pointer; font: 500 14px var(--f-body); color: var(--ink); }
.side-item:hover { background: var(--card); }
.side-item[aria-current="true"] { background: var(--card); box-shadow: inset 3px 0 0 var(--accent); font-weight: 700; }
.minw { min-width: 0; }
.prose { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 24px 28px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.prose h3 { margin-top: 12px; }
.prose ul, .prose ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.formula { font-family: var(--f-mono); font-size: 14px; background: var(--accent-soft); color: var(--ink); padding: 10px 14px; border-radius: 8px; overflow-x: auto; }
.ex { border-left: 2px solid var(--line); padding-left: 12px; color: var(--muted); }
.ex b { color: var(--ink); }
table.mini { border-collapse: collapse; font-size: 14px; margin: 4px 0; font-variant-numeric: tabular-nums; }
table.mini th, table.mini td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
table.mini th { background: var(--paper); font-weight: 600; }
.prose table.mini { display: block; overflow-x: auto; max-width: 100%; }
code, pre { font-family: var(--f-mono); font-size: 13px; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
pre.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0; white-space: pre; }
.viewhead { display: flex; flex-direction: column; gap: 6px; }
.viewhead p { max-width: 90ch; font-size: 14px; }

/* training */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 600 13px var(--f-body); border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 6px 12px; border-radius: 99px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.session { display: flex; gap: 18px; margin: 14px 0 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.session b { color: var(--ink); }
.qcard, .codecard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.qbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); gap: 12px; }
.qlabel { font: 600 13px var(--f-mono); color: var(--muted); }
.timer { font: 600 14px var(--f-mono); font-variant-numeric: tabular-nums; background: var(--good-soft); color: var(--good); padding: 4px 10px; border-radius: 8px; }
.timer.low { background: var(--mid-soft); color: var(--mid); }
.timer.over { background: var(--bad-soft); color: var(--bad); }
.qgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.qtext { padding: 22px 24px; display: flex; flex-direction: column; gap: 10px; min-width: 0; border-right: 1px solid var(--line); }
.qq { font-size: 18px; font-weight: 600; line-height: 1.45; }
.qtype { font-size: 12px; color: var(--muted); }
.qopts { padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.olabel { font: 600 12px var(--f-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; cursor: pointer; background: var(--card); }
.opt:hover { border-color: var(--accent); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .key { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font: 600 11px var(--f-mono); color: var(--muted); margin-top: 1px; }
.opt input[type="checkbox"] + .key { border-radius: 5px; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:checked) .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt .otext { min-width: 0; overflow-wrap: anywhere; }
.opt.code .otext { font-family: var(--f-mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 100%; }
.outbox { width: 100%; font: 12px var(--f-mono); background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; }
.tverdict { font-size: 12px; } .tverdict.ok { color: var(--good); } .tverdict.no { color: var(--bad); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .key { background: var(--good); border-color: var(--good); color: var(--card); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--card); }
.opt:has(input:disabled) { cursor: default; }
.hint { font-size: 12px; color: var(--muted); }
.feedback { display: flex; flex-direction: column; gap: 10px; border-top: 1px dashed var(--line); padding-top: 14px; }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.expl { font-size: 14px; line-height: 1.6; }
[hidden] { display: none !important; }
.expl ul.why { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 3px; }
.feedback .next { align-self: flex-start; }
.empty { background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }

/* code */
.cgrid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); }
.cstate { padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--line); min-width: 0; }
.ceditor { padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; background: var(--paper); }
.edhead { display: flex; justify-content: space-between; font: 600 12px var(--f-mono); color: var(--muted); gap: 8px; }
.editor { width: 100%; min-height: 300px; resize: vertical; font: 13px/1.55 var(--f-mono); background: var(--code-bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; tab-size: 4; white-space: pre; overflow: auto; }
.editor.sql { min-height: 150px; }
.editor:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.tcase .io, .tres .io { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; font-size: 12px; align-items: start; }
.io span { color: var(--muted); padding-top: 6px; }
.io pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 0; overflow-x: auto; white-space: pre; }
pre.err { color: var(--bad); white-space: pre-wrap; background: var(--bad-soft); border: 0; padding: 8px 10px; border-radius: 6px; margin: 0; }
.results { display: flex; flex-direction: column; gap: 8px; }
.tres { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--card); display: flex; flex-direction: column; gap: 6px; }
.tres.ok .tname { color: var(--good); } .tres.no .tname { color: var(--bad); }
.tname { font: 600 12px var(--f-mono); }
.refsol { display: flex; flex-direction: column; gap: 8px; }
.hintbox summary, .schema summary, details summary { cursor: pointer; font-weight: 600; }
.schema { margin: 14px 0 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
.schema[open] summary { margin-bottom: 10px; }
.sqlcard { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.sqlmsg, .sqlout { display: flex; flex-direction: column; gap: 8px; }

/* exam */
.examstart, .examres { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
.facts { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; width: 100%; }
.facts li { background: var(--paper); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
.facts b { display: block; color: var(--ink); font-family: var(--f-display); font-size: 18px; font-weight: 500; }
.eprog { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; font: 600 13px var(--f-mono); color: var(--muted); flex-wrap: wrap; }
.ebar { flex: 1; min-width: 120px; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.ebar span { display: block; height: 100%; background: var(--accent); }
.leave { background: var(--mid-soft); color: var(--ink); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
.score { display: flex; align-items: baseline; gap: 8px; }
.score .big { font: 700 72px/1 var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.score .of { font: 500 24px var(--f-display); color: var(--muted); }
.examres .tablewrap { width: 100%; }
.review { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; width: 100%; }
.review > li { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; border-left: 3px solid var(--good); }
.review > li.no { border-left-color: var(--bad); }
.review summary { font-weight: 500; font-size: 14px; }
.review details[open] { display: flex; flex-direction: column; gap: 10px; }
.review details[open] summary { margin-bottom: 8px; }
.rnum { font: 600 12px var(--f-mono); color: var(--muted); margin-right: 4px; }
ul.ans { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 4px; font-size: 14px; }
ul.ans li { padding: 6px 10px; border-radius: 6px; background: var(--paper); overflow-wrap: anywhere; }
ul.ans li.right { background: var(--good-soft); color: var(--good); font-weight: 600; }
ul.ans li.wrong { background: var(--bad-soft); color: var(--bad); }

@media (max-width: 820px) {
  .hero { grid-template-columns: 1fr; }
  .qgrid, .cgrid { grid-template-columns: 1fr; }
  .qtext, .cstate { border-right: 0; border-bottom: 1px solid var(--line); }
  .split { grid-template-columns: 1fr; }
  .side { position: static; max-height: none; flex-direction: row; overflow-x: auto; }
  .side-item { white-space: nowrap; }
  .day { grid-template-columns: 1fr; gap: 8px; }
  .prose { padding: 18px; }
  .examstart, .examres { padding: 20px; }
}
@media (max-width: 480px) {
  .qtext, .qopts, .cstate { padding: 16px; }
  .qq { font-size: 16px; }
  .brand span.full { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .qcard, .codecard { animation: rise 0.18s ease-out; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
</style>

<header class="top">
  <div class="shell">
    <div class="brand"><span class="dot">30</span><span class="full">Тест Авито</span></div>
    <nav class="nav" aria-label="Разделы">
      <button data-view="plan">План</button>
      <button data-view="theory">Теория</button>
      <button data-view="train">Тренировка</button>
      <button data-view="exam">Пробный тест</button>
      <button data-view="sql">SQL</button>
      <button data-view="python">Python</button>
    </nav>
  </div>
</header>
<main class="shell">
  <section id="v-plan"></section>
  <section id="v-theory" hidden></section>
  <section id="v-train" hidden></section>
  <section id="v-exam" hidden></section>
  <section id="v-sql" hidden></section>
  <section id="v-python" hidden></section>
</main>
<script>

\ndef solve():\n    groups = [g.strip() for g in sys.stdin.readline().split(',')]\n    values = [int(v) for v in sys.stdin.readline().split(',')]\n    df = pd.DataFrame({'group': groups, 'value': values})\n    df = df.sort_values('group', kind='stable').reset_index(drop=True)\n    df['value_diff'] = df.groupby('group')['value'].transform('mean')\n    print(', '.join(str(int(x)) for x in df['value_diff'].round()))\n\nif __name__ == '__main__':\n    solve()\n", "ref_py": "import sys\n\ndef solve():\n    groups = [g.strip() for g in sys.stdin.readline().split(',')]\n    values = [int(v) for v in sys.stdin.readline().split(',')]\n    rows = sorted(zip(groups, values), key=lambda r: r[0])\n    sums, cnts = {}, {}\n    for g, v in rows:\n        sums[g] = sums.get(g, 0) + v\n        cnts[g] = cnts.get(g, 0) + 1\n    print(', '.join(str(round(sums[g] / cnts[g])) for g, _ in rows))\n\nif __name__ == '__main__':\n    solve()\n", "hint": "Отсортируйте пары (group, value) по group, посчитайте сумму и количество по каждой группе в словарях, затем для каждой строки выведите среднее её группы.", "tests": [{"inp": "b, a, b, a, b\n10, 20, 30, 40, 50", "out": "30, 30, 30, 30, 30"}, {"inp": "x, y, x, z\n3, 8, 5, 1", "out": "4, 4, 8, 1"}, {"inp": "c, c, c\n7, 8, 12", "out": "9, 9, 9"}, {"inp": "b, a, c, a, c, b\n100, 1, 7, 3, 11, 50", "out": "2, 2, 75, 75, 9, 9"}, {"inp": "m, k, m, k, k\n10, 20, 30, 41, 60", "out": "40, 40, 40, 20, 20"}], "bugs": ["import sys\n\ndef solve():\n    groups = [g.strip() for g in sys.stdin.readline().split(',')]\n    values = [int(v) for v in sys.stdin.readline().split(',')]\n    rows = list(zip(groups, values))\n    sums, cnts = {}, {}\n    for g, v in rows:\n        sums[g] = sums.get(g, 0) + v\n        cnts[g] = cnts.get(g, 0) + 1\n    print(', '.join(str(round(sums[g] / cnts[g])) for g, _ in rows))\n\nif __name__ == '__main__':\n    solve()\n", "import sys\n\ndef solve():\n    groups = [g.strip() for g in sys.stdin.readline().split(',')]\n    values = [int(v) for v in sys.stdin.readline().split(',')]\n    rows = sorted(zip(groups, values), key=lambda r: r[0])\n    sums, cnts = {}, {}\n    for g, v in rows:\n        sums[g] = sums.get(g, 0) + v\n        cnts[g] = cnts.get(g, 0) + 1\n    print(', '.join(str(round(sums[g] / len(rows))) for g, _ in rows))\n\nif __name__ == '__main__':\n    solve()\n", "import sys\n\ndef solve():\n    groups = sys.stdin.readline().split(',')\n    values = [int(v) for v in sys.stdin.readline().split(',')]\n    rows = sorted(zip(groups, values), key=lambda r: r[0])\n    sums, cnts = {}, {}\n    for g, v in rows:\n        sums[g] = sums.get(g, 0) + v\n        cnts[g] = cnts.get(g, 0) + 1\n    print(', '.join(str(round(sums[g] / cnts[g])) for g, _ in rows))\n\nif __name__ == '__main__':\n    solve()\n"]}, {"id": "digit_sum", "title": "Сумма цифр каждого числа", "text": "Дана строка целых чисел через пробел. Для каждого числа выведите сумму его цифр (знак минус игнорируется), через пробел в том же порядке.", "fin": "Целые числа через пробел.", "fout": "Суммы цифр через пробел.", "ref": "import sys\n\ndef solve():\n    nums = sys.stdin.readline().split()\n    print(' '.join(str(sum(int(c) for c in n.lstrip('-'))) for n in nums))\n\nif __name__ == '__main__':\n    solve()\n", "hint": "sum(int(c) for c in строка_числа).", "tests": [{"inp": "12 345 6", "out": "3 12 6"}, {"inp": "999 1000 0", "out": "27 1 0"}, {"inp": "-58 7 10101", "out": "13 7 3"}, {"inp": "123456789", "out": "45"}], "bugs": ["import sys\n\ndef solve():\n    nums = sys.stdin.readline().split()\n    print(' '.join(str(len(n.lstrip('-'))) for n in nums))\n\nif __name__ == '__main__':\n    solve()\n", "import sys\n\ndef solve():\n    nums = sys.stdin.readline().split()\n    print(' '.join(str(sum(int(c) for c in n)) for n in nums))\n\nif __name__ == '__main__':\n    solve()\n", "import sys\n\ndef solve():\n    nums = sys.stdin.readline().split()\n    print(' '.join(str(int(n) % 9) for n in nums))\n\nif __name__ == '__main__':\n    solve()\n"]}, {"id": "group_share", "title": "Доля от суммы группы", "text": "Даны две строки: groups и values (целые положительные) через запятую. Для каждой строки таблицы посчитайте долю её value от суммы value в её группе, в процентах, округлив до целых. Порядок строк исходный.", "fin": "Строка 1 — groups. Строка 2 — values.", "fout": "Проценты через «, ».", "ref": "import sys\n\ndef solve():\n    groups = [g.strip() for g in sys.stdin.readline().split(',')]\n    values = [int(v) for v in sys.stdin.readline().split(',')]\n    total = {}\n    for g, v in zip(groups, values):\n        total[g] = total.get(g, 0) + v\n    print(', '.join(str(round(v * 100 / total[g])) for g, v in zip(groups, values)))\n\nif __name__ == '__main__':\n    solve()\n", "ref_pd": "df['share'] = (df['value'] / df.groupby('group')['value'].transform('sum') * 100).round()", "hint": "Сначала словарь сумм по группам, потом второй проход по строкам.", "tests": [{"inp": "a, b, a, b\n30, 10, 70, 30", "out": "30, 25, 70, 75"}, {"inp": "x, x, x, y\n1, 1, 2, 9", "out": "25, 25, 50, 100"}, {"inp": "k, m, k, m, k\n20, 5, 20, 15, 60", "out": "20, 25, 20, 75, 60"}, {"inp": "p\n42", "out": "100"}], "bugs": ["import sys\n\ndef solve():\n    groups = [g.strip() for g in sys.stdin.readline().split(',')]\n    values = [int(v) for v in sys.stdin.readline().split(',')]\n    total = {}\n    for g, v in zip(groups, values):\n        total[g] = total.get(g, 0) + v\n    print(', '.join(str(round(v * 100 / sum(values))) for g, v in zip(groups, values)))\n\nif __name__ == '__main__':\n    solve()\n", "import sys\n\ndef solve():\n    groups = [g.strip() for g in sys.stdin.readline().split(',')]\n    values = [int(v) for v in sys.stdin.readline().split(',')]\n    total = {}\n    for g, v in zip(groups, values):\n        total[g] = total.get(g, 0) + v\n    print(', '.join(str(round(v * 100 / max(values))) for g, v in zip(groups, values)))\n\nif __name__ == '__main__':\n    solve()\n", "import sys\n\ndef solve():\n    groups = [g.strip() for g in sys.stdin.readline().split(',')]\n    values = [int(v) for v in sys.stdin.readline().split(',')]\n    total = {}\n    for g, v in zip(groups, values):\n        total[g] = v\n    print(', '.join(str(round(v * 100 / total[g])) for g, v in zip(groups, values)))\n\nif __name__ == '__main__':\n    solve()\n"]}, {"id": "group_cumsum", "title": "Накопленная сумма по группе", "text": "Даны groups и values через запятую. Для каждой строки выведите накопленную сумму value внутри её группы (с начала таблицы до этой строки включительно). Порядок строк исходный.", "fin": "Строка 1 — groups. Строка 2 — values.", "fout": "Накопленные суммы через «, ».", "ref": "import sys\n\ndef solve():\n    groups = [g.strip() for g in sys.stdin.readline().split(',')]\n    values = [int(v) for v in sys.stdin.readline().split(',')]\n    running, out = {}, []\n    for g, v in zip(groups, values):\n        running[g] = running.get(g, 0) + v\n        out.append(running[g])\n    print(', '.join(map(str, out)))\n\nif __name__ == '__main__':\n    solve()\n", "ref_pd": "df['cum'] = df.groupby('group')['value'].cumsum()", "hint": "Словарь «текущая сумма группы», обновляйте его по ходу прохода.", "tests": [{"inp": "a, b, a, b, a\n1, 2, 3, 4, 5", "out": "1, 2, 4, 6, 9"}, {"inp": "x, x, x\n10, -3, 5", "out": "10, 7, 12"}, {"inp": "u, v, w, u\n7, 7, 7, 7", "out": "7, 7, 7, 14"}, {"inp": "a, b, b, a, c, b\n5, 1, 1, 5, 9, 1", "out": "5, 1, 2, 10, 9, 3"}], "bugs": ["import sys\n\ndef solve():\n    groups = [g.strip() for g in sys.stdin.readline().split(',')]\n    values = [int(v) for v in sys.stdin.readline().split(',')]\n    running, out = {}, []\n    for g, v in zip(groups, values):\n        running[g] = v\n        out.append(running[g])\n    print(', '.join(map(str, out)))\n\nif __name__ == '__main__':\n    solve()\n", "import sys\n\ndef solve():\n    groups = [g.strip() for g in sys.stdin.readline().split(',')]\n    values = [int(v) for v in sys.stdin.readline().split(',')]\n )\n    print(' '.join(map(str, out)))\n\nif __name__ == '__main__':\n    solve()\n", "import sys\n\ndef solve():\n    groups = [g.strip() for g in sys.stdin.readline().split(',')]\n    seen, out = {}, []\n    for g in groups:\n        seen[g] = seen.get(g, 0) + 1\n        out.append(groups.index(g) + 1)\n    print(' '.join(map(str, out)))\n\nif __name__ == '__main__':\n    solve()\n"]}, {"id": "mode", "title": "Самое частое число", "text": "Дана строка целых чисел через пробел. Выведите число, которое встречается чаще всего. Если таких несколько — наименьшее из них.", "fin": "Целые числа через пробел.", "fout": "Одно число.", "ref": "import sys\nfrom collections import Counter\n\ndef solve():\n    nums = list(map(int, sys.stdin.readline().split()))\n    cnt = Counter(nums)\n    best = max(cnt.values())\n    print(min(k for k, v in cnt.items() if v == best))\n\nif __name__ == '__main__':\n    solve()\n", "hint": "collections.Counter, затем максимум частоты и минимум среди чисел с этой частотой.", "tests": [{"inp": "1 3 3 2 1 3", "out": "3"}, {"inp": "5 5 4 4", "out": "4"}, {"inp": "-1 -1 7 7 -2", "out": "-1"}, {"inp": "42", "out": "42"}], "bugs": ["import sys\nfrom collections import Counter\n\ndef solve():\n    nums = list(map(int, sys.stdin.readline().split()))\n    cnt = Counter(nums)\n    best = max(cnt.values())\n    print(cnt.most_common(1)[0][0])\n\nif __name__ == '__main__':\n    solve()\n", "import sys\nfrom collections import Counter\n\ndef solve():\n    nums = list(map(int, sys.stdin.readline().split()))\n    cnt = Counter(nums)\n    best = max(cnt.values())\n    print(max(k for k, v in cnt.items() if v == best))\n\nif __name__ == '__main__':\n    solve()\n", "import sys\nfrom collections import Counter\n\ndef solve():\n    nums = list(map(int, sys.stdin.readline().split()))\n    cnt = Counter(nums)\n    best = max(cnt.values())\n    print(max(nums, key=nums.count))\n\nif __name__ == '__main__':\n    solve()\n"]}, {"id": "nunique", "title": "Уникальные значения в группе", "text": "Даны groups и values через запятую. Для каждой группы посчитайте количество уникальных value. Выведите пары «группа:количество» через пробел, группы по возрастанию.", "fin": "Строка 1 — groups. Строка 2 — values.", "fout": "Пары group:n через пробел.", "ref": "import sys\n\ndef solve():\n    groups = [g.strip() for g in sys.stdin.readline().split(',')]\n    values = [int(v) for v in sys.stdin.readline().split(',')]\n    uniq = {}\n    for g, v in zip(groups, values):\n        uniq.setdefault(g, set()).add(v)\n    print(' '.join(f'{g}:{len(uniq[g])}' for g in sorted(uniq)))\n\nif __name__ == '__main__':\n    solve()\n", "ref_pd": "df.groupby('group')['value'].nunique()", "hint": "Словарь групп → множество значений.", "tests": [{"inp": "b, a, b, a, b\n1, 2, 1, 3, 4", "out": "a:2 b:2"}, {"inp": "x, x, x\n5, 5, 5", "out": "x:1"}, {"inp": "c, a, b, a\n1, 1, 1, 2", "out": "a:2 b:1 c:1"}, {"inp": "q, p, q, p, q, p\n9, 8, 7, 8, 9, 6", "out": "p:2 q:2"}], "bugs": ["import sys\n\ndef solve():\n    groups = [g.strip() for g in sys.stdin.readline().split(',')]\n    values = [int(v) for v in sys.stdin.readline().split(',')]\n    uniq = {}\n    for g, v in zip(groups, values):\n        uniq.setdefault(g, set()).add(v)\n    print(' '.join(f'{g}:{groups.count(g)}' for g in sorted(uniq)))\n\nif __name__ == '__main__':\n    solve()\n", "import sys\n\ndef solve():\n    groups = [g.strip() for g in sys.stdin.readline().split(',')]\n    values = [int(v) for v in sys.stdin.readline().split(',')]\n    uniq = {}\n    for g, v in zip(groups, values):\n        uniq.setdefault(g, set()).add(v)\n    print(' '.join(f'{g}:{len(uniq[g])}' for g in uniq))\n\nif __name__ == '__main__':\n    solve()\n", "import sys\n\ndef solve():\n    groups = [g.strip() for g in sys.stdin.readline().split(',')]\n    values = [int(v) for v in sys.stdin.readline().split(',')]\n    uniq = {}\n    for g, v in zip(groups, values):\n        uniq.setdefault(g, []).append(v)\n    print(' '.join(f <script>
/* Question generators: each returns {topic, kind, text, html, options, correct, expl, time} */
const R = {
  int(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  sample(arr, k) { return R.shuffle(arr).slice(0, k); }
};
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
function frac(n, d) { const g = gcd(n, d) || 1; n /= g; d /= g; return d === 1 ? String(n) : n + '/' + d; }
function dec(x, d = 2) { let s = (Math.round(x * 10 ** d) / 10 ** d).toFixed(d); if (d > 0) s = s.replace(/0+$/, '').replace(/\.$/, ''); return s.replace('.', ','); }
function decFixed(x, d) { return (Math.round(x * 10 ** d) / 10 ** d).toFixed(d).replace('.', ','); }
function C(n, k) { if (k < 0 || k > n) return 0; let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return Math.round(r); }
function A(n, k) { let r = 1; for (let i = 0; i < k; i++) r *= (n - i); return r; }
function fact(n) { return n <= 1 ? 1 : n * fact(n - 1); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function plural(n, one, few, many) { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return one; if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few; return many; }

function single(o) {
  const correct = String(o.correct);
  const uniq = [];
  for (const w of o.wrong.map(String)) if (w !== correct && !uniq.includes(w)) uniq.push(w);
  const num = Number(correct.replace(',', '.'));
  for (let k = 1; uniq.length < (o.n || 4) - 1 && k < 20; k++) {
    if (!Number.isFinite(num)) break;
    for (const c of [num + k, num - k]) { const v = String(c).replace('.', ','); if (c >= 0 && v !== correct && !uniq.includes(v) && uniq.length < (o.n || 4) - 1) uniq.push(v); }
  }
  const opts = R.shuffle([correct, ...uniq.slice(0, (o.n || 4) - 1)]);
  return { topic: o.topic, kind: 'single', text: o.text, html: o.html || '', code: !!o.code, options: opts, correct: [opts.indexOf(correct)], expl: o.expl, time: o.time || 60 };
}
function multi(o) {
  let st = o.statements.slice();
  if (o.pickN) {
    for (let tries = 0; tries < 50; tries++) {
      const s = R.sample(o.statements, o.pickN);
      if (s.some(x => x.ok) && s.some(x => !x.ok)) { st = s; break; }
    }
  }
  st = o.keepOrder ? st : R.shuffle(st);
  return { topic: o.topic, kind: 'multi', text: o.text, html: o.html || '', code: !!o.code, options: st.map(s => s.t), correct: st.map((s, i) => s.ok ? i : -1).filter(i => i >= 0), expl: o.expl + (o.why ? '' : '') + '<ul class="why">' + st.map(s => `<li><b>${s.ok ? 'Верно' : 'Неверно'}:</b> ${esc(s.t)}${s.why ? ' — ' + s.why : ''}</li>`).join('') + '</ul>', time: o.time || 120 };
}
function bank(topic, items) {
  return () => {
    const it = R.pick(items);
    if (it.statements) return multi({ topic, text: it.q, html: it.html, statements: it.statements, pickN: it.pickN || 4, expl: it.expl || '', time: it.time || 120 });
    return single({ topic, text: it.q, html: it.html, correct: it.a, wrong: it.w, expl: it.expl, time: it.time || 60, code: it.code });
  };
}

const G = {};

  const yrs = v => v + ' ' + plural(v, 'год', 'года', 'лет');
  return single({ topic: 'logic',
    text: `В группе из ${n} ${who[0]} ${who[1]} — ${yrs(avg)}. К группе присоединился ещё один, ${who[2]} ${yrs(x)}. Чему равно новое среднее?`,
    correct: r, wrong: [r + 1, r - 1, Math.round((avg + x) / 2), r + 2],
    expl: `Сумма до: ${n} × ${avg} = ${n * avg}. Новая сумма: ${n * avg} + ${x} = ${n * avg + x}. Делим на ${n + 1}: ${(n * avg + x)} / ${n + 1} = <b>${r}</b>. Ловушка — усреднять средние: (${avg} + ${x}) / 2.` });
};
G.work = () => {

  const tot = t + d;
  return single({ topic: 'logic',
    text: `${w} рабочих могут выполнить задачу за ${D} дней. Задачу начали ${w} рабочих, через ${t} ${plural(t, 'день', 'дня', 'дней')} к ним присоединилось ещё ${a}. Сколько ВСЕГО дней ушло на задачу?`,

};

  if (type === 'nn1') { const s = R.int(1, 4); for (let n = s; n < s + 5; n++) terms.push(n * (n + 1)); next = (s + 5) * (s + 6); rule = `n(n+1): ${terms.map((v, i) => `${s + i}·${s + i + 1}`).join(', ')} → ${s + 5}·${s + 6}`; }
  if (type === 'sq') { const c = R.int(-3, 5), s = R.int(1, 3); for (let n = s; n < s + 5; n++) terms.push(n * n + c); next = (s + 5) ** 2 + c; rule = `n² ${c >= 0 ? '+ ' + c : '− ' + (-c)}`; }
  if (type === 'arith') { const a = R.int(1, 20), d = R.int(3, 9); for (let i = 0; i < 5; i++) terms.push(a + d * i); next = a + 5 * d; rule = `каждый раз +${d}`; }
  if (type === 'geom') { const a = R.int(1, 5), q = R.pick([2, 3]); for (let i = 0; i < 5; i++) terms.push(a * q ** i); next = a * q ** 5; rule = `каждый раз ×${q}`; }
  if (type === 'second') { const a = R.int(1, 10), d = R.int(1, 4), c = R.int(1, 3); let v = a, step = d; for (let i = 0; i < 5; i++) { terms.push(v); v += step; step += c; } next = v; rule = `разности растут на ${c}: ${terms.slice(1).map((x, i) => x - terms[i]).join(', ')} → ${next - terms[4]}`; }
  if (type === 'fib') { let a = R.int(1, 3), b = R.int(2, 5); terms = [a, b]; while (terms.length < 6) terms.push(terms[terms.length - 1] + terms[terms.length - 2]); next = terms[4] + terms[5]; rule = 'каждое число — сумма двух предыдущих'; terms = terms.slice(0, 6); }
  const last = terms[terms.length - 1], diff = last - terms[terms.length - 2];
  return single({ topic: 'logic', text: `Числа идут в последовательности: ${terms.join(', ')}… Какое число будет следующим?`,

    expl: `Правило: ${rule}. Ответ: <b>${next}</b>. Алгоритм: сначала разности соседних чисел, затем n(n+1), n², степени, сумма двух предыдущих.` });
};

G.zScore = () => {
  const mu = R.int(50, 100), sd = R.pick([5, 10, 15, 20]), z = R.pick([-2, -1.5, -1, 1, 1.5, 2, 2.5]), x = mu + z * sd;
  return single({ topic: 'stats', text: `Среднее время на сайте — ${mu} с, стандартное отклонение — ${sd} с. У пользователя ${dec(x, 1)} с. Чему равен его z-score?`, correct: dec(z, 1), wrong: [dec(-z, 1), dec(z * 2, 1), dec((x - mu) / (sd * sd), 2), dec(z + 1, 1)],
    expl: `z = (x − μ)/σ = (${dec(x, 1)} − ${mu})/${sd} = <b>${dec(z, 1)}</b>.` });
};

/* ---------- ГИПОТЕЗЫ И A/B ---------- */
G.pDecision = () => {
  const alpha = R.pick([0.05, 0.05, 0.01, 0.1]);
  const p = R.pick([0.001, 0.008, 0.02, 0.03, 0.04, 0.049, 0.06, 0.08, 0.12, 0.3]);
  const sig = p < alpha, feat = R.pick(['новой версии кнопки «Купить»', 'нового алгоритма рекомендаций', 'нового онбординга', 'изменённой цены доставки']);
  return single({ topic: 'hyp', text: `В A/B-тесте ${feat} участвовали 1000 пользователей в каждой группе. Результат: p-value = ${dec(p, 3)}. Уровень значимости ${dec(alpha)}. Какой вывод правильный?`,
    correct: sig ? `Есть статистически значимый эффект на уровне ${dec(alpha)}` : `Нет статистически значимого эффекта на уровне ${dec(alpha)}`,
    wrong: [sig ? `Нет статистически значимого эффекта на уровне ${dec(alpha)}` : `Есть статистически значимый эффект на уровне ${dec(alpha)}`, `Вероятность, что новая версия лучше, — ${dec((1 - p) * 100, 1)}%`, sig ? 'Эффект доказан с вероятностью 100%' : 'Новая версия точно не влияет на метрику'],
    expl: `${dec(p, 3)} ${sig ? '<' : '≥'} ${dec(alpha)} → ${sig ? 'отвергаем H₀' : 'не отвергаем H₀'}. p-value — не вероятность гипотезы, а вероятность получить такие или более экстремальные данные при верной H₀. «Не отвергли» не значит «эффекта нет».` });
};
G.abTable = () => {
  const c = R.int(5, 15), d = R.pick([1, 2, 3, -1, -2]), t = c + d, p = R.pick([0.01, 0.03, 0.04, 0.07, 0.2]), sig = p < 0.05;
  const html = `<table class="mini"><tr><th>Группа</th><th>CTR</th></tr><tr><td>Контроль</td><td>${c}%</td></tr><tr><td>Тест</td><td>${t}%</td></tr></table><p class="mono">p-value = ${dec(p)}</p>`;
  const dir = d > 0 ? 'улучшает' : 'ухудшает';
  return single({ topic: 'hyp', text: 'В тесте измеряли CTR новой кнопки, α = 0,05. Какое утверждение корректно?', html,
    correct: sig ? `Разница ${Math.abs(d)} п.п. статистически значима на уровне 0,05` : `Разница ${Math.abs(d)} п.п. не значима на уровне 0,05`,
    wrong: [sig ? `Разница ${Math.abs(d)} п.п. не значима на уровне 0,05` : `Разница ${Math.abs(d)} п.п. статистически значима на уровне 0,05`, `Вероятность ошибки составляет ${Math.abs(d)}%`, sig ? 'Нужно принять нулевую гипотезу' : `Новая кнопка точно ${dir} CTR`, `Новая кнопка ${d > 0 ? 'ухудшает' : 'улучшает'} CTR`],
    expl: `p = ${dec(p)} ${sig ? '<' : '≥'} 0,05 → ${sig ? 'отвергаем' : 'не отвергаем'} H₀. Направление эффекта видно из таблицы: тест ${d > 0 ? 'выше' : 'ниже'} контроля. Разница процентов — это процентные пункты, а не «вероятность ошибки».` });
};

  { q: 'Вы провели A/B-тест баннера. Результат признали успешным, но на самом деле конверсия не выросла. Какая ошибка допущена?', a: 'Ошибка первого рода (Type I)', w: ['Ошибка второго рода (Type II)', 'Ошибка третьего рода (Type III)', 'Систематическая ошибка'], expl: 'Нашли эффект, которого нет — ложноположительный результат, ошибка I рода.' },

  { q: 'Что такое мощность статистического критерия?', a: 'Вероятность отклонить H₀, когда она неверна', w: ['Вероятность отклонить верную H₀', '1 − α', 'Вероятность того, что H₀ верна'], expl: 'Мощность = 1 − β: шанс обнаружить эффект, если он есть.' },

  { q: 'Как изменится мощность теста, если увеличить размер выборки (остальное неизменно)?', a: 'Увеличится', w: ['Уменьшится', 'Не изменится', 'Станет равна 1 − α'], expl: 'Больше данных → меньше SE → проще заметить эффект.' },
  { q: 'Как изменится мощность, если ужесточить α с 0,05 до 0,01?', a: 'Уменьшится', w: ['Увеличится', 'Не изменится', 'Станет 0,99'], expl: 'Строже порог → труднее отвергнуть H₀ → ниже мощность (больше ошибок II рода).' },
  { q: 'Какой критерий подходит для сравнения конверсий двух групп при больших выборках?', a: 'z-тест для долей (или χ²)', w: ['Парный t-тест', 'Корреляция Пирсона', 'Тест Шапиро — Уилка'], expl: 'Конверсия — доля, для двух независимых долей используют z-тест или χ².' },
  { q: 'Какой критерий подходит для сравнения среднего чека в двух независимых группах?', a: 't-тест Стьюдента (Уэлча) или бутстреп', w: ['z-тест для долей', 'χ² на независимость', 'Парный t-тест'], expl: 'Средние непрерывной метрики — t-тест (Уэлча, если дисперсии различаются). При тяжёлых хвостах — бутстреп или Манна — Уитни.' },
  { q: 'Что такое MDE?', a: 'Минимальный эффект, который тест способен обнаружить при заданных α и мощности', w: ['Средний эффект по всем тестам', 'Максимально допустимая ошибка', 'Медиана распределения эффекта'], expl: 'MDE считают до теста, чтобы определить нужный размер выборки.' },
  { q: 'Зачем в A/B-тесте guardrail-метрики?', a: 'Чтобы убедиться, что улучшение целевой метрики не ухудшило другие важные метрики', w: ['Чтобы увеличить мощность теста', 'Чтобы заменить целевую метрику', 'Чтобы проверить нормальность'], expl: 'Например, рост кликов не должен сопровождаться ростом отписок или падением выручки.' }

G.powerMulti = () => multi({ topic: 'hyp', text: 'Рассматриваются два критерия с одинаковым α. Какие утверждения верны?', pickN: 4, time: 120, expl: '',

G.sampleSize = () => {
  const sig = R.pick([10, 20, 40, 50]), d = R.pick([sig / 2, sig / 4, sig / 5, sig]); const n = Math.round(16 * sig * sig / (d * d));
  return single({ topic: 'hyp', text: `Оцените размер выборки на группу по правилу n ≈ 16σ²/δ² (α = 0,05, мощность 80%): σ = ${sig}, минимальный эффект δ = ${dec(d, 1)}.`,
    correct: n, wrong: [n / 4, n * 2, Math.round(16 * sig / d), n * 4],
    expl: `n ≈ 16 × ${sig}² / ${dec(d, 1)}² = 16 × ${sig * sig} / ${dec(d * d, 2)} = <b>${n}</b>. Эффект в 2 раза меньше → выборка в 4 раза больше.`, time: 90 });
};
G.multiple = () => {
  const k = R.pick([5, 10, 20, 40]);
  const v = R.pick(['fp', 'bonf']);
  if (v === 'fp') return single({ topic: 'hyp', text: `В тесте проверяют ${k} независимых метрик при α = 0,05, и реального эффекта нет ни в одной. Сколько ложных «значимых» результатов ожидается в среднем?`, correct: dec(k * 0.05, 2), wrong: ['0', '0,05', dec(k * 0.01, 2), '1'].filter(x => x !== dec(k * 0.05, 2)), expl: `Ожидаемое число ложных срабатываний = k × α = ${k} × 0,05 = <b>${dec(k * 0.05, 2)}</b>. Отсюда поправки на множественные сравнения.` });
  return single({ topic: 'hyp', text: `Нужно проверить ${k} гипотез, сохранив общий уровень ошибки 0,05. Какой порог для каждой по поправке Бонферрони?`, correct: dec(0.05 / k, 4), wrong: ['0,05', dec(0.05 * k, 2), dec(0.05 / Math.sqrt(k), 4), dec(0.01, 2)], expl: `α / k = 0,05 / ${k} = <b>${dec(0.05 / k, 4)}</b>.` });
};

/* ---------- ML ---------- */
G.confusion = () => {
  let TP, FP, FN, TN;
  do { TP = R.int(3, 12); FP = R.int(1, 6); FN = R.int(1, 6); TN = R.int(8, 30); } while (FP === FN);
  const N = TP + FP + FN + TN, P = TP / (TP + FP), Rc = TP / (TP + FN), Ac = (TP + TN) / N;
  const f = (p, r, a) => `P = ${dec(p, 3)}, R = ${dec(r, 3)}, A = ${dec(a, 3)}`;
  return single({ topic: 'ml', text: `В тестовой выборке ${N} пациентов. Модель сказала «болен» у ${TP + FP}, из них реально больны ${TP}. Модель сказала «не болен» у ${FN + TN}, из них реально больны ${FN}. Определите Precision (P), Recall (R), Accuracy (A).`,
    correct: f(P, Rc, Ac), wrong: [f(Rc, P, Ac), f(P, Rc, TP / N), f(TP / N, Rc, Ac), f(P, TN / (TN + FP), Ac)],
    expl: `TP = ${TP}, FP = ${FP}, FN = ${FN}, TN = ${TN}. P = ${TP}/${TP + FP} = ${dec(P, 3)}; R = ${TP}/${TP + FN} = ${dec(Rc, 3)}; A = (${TP} + ${TN})/${N} = ${dec(Ac, 3)}.`, time: 150 });
};
G.fit = () => {
  const v = R.pick(['over', 'under', 'good']);
  const tr = v === 'over' ? R.int(95, 99) : v === 'under' ? R.int(55, 65) : R.int(86, 92);
  const te = v === 'over' ? R.int(55, 70) : v === 'under' ? tr - R.int(0, 3) : tr - R.int(1, 3);
  const html = `<table class="mini"><tr><th>Выборка</th><th>Точность</th></tr><tr><td>Обучающая</td><td>${tr}%</td></tr><tr><td>Тестовая</td><td>${te}%</td></tr></table>`;
  const ans = { over: 'Переобучение (overfitting)', under: 'Недообучение (underfitting)', good: 'Хорошо обобщающаяся (well-generalized)' }[v];
  return single({ topic: 'ml', text: `Вы обучили ${v === 'under' ? 'очень простую модель на сложной задаче' : v === 'over' ? 'сложную модель на небольшом датасете' : 'модель с регуляризацией'}. Что можно сказать о модели?`, html,
    correct: ans, wrong: ['Переобучение (overfitting)', 'Недообучение (underfitting)', 'Хорошо обобщающаяся (well-generalized)', 'Нельзя сделать ни один из этих выводов'],
    expl: v === 'over' ? 'Большой разрыв между train и test — модель запомнила обучающие данные. Лечится регуляризацией, упрощением модели, бо́льшим объёмом данных.' : v === 'under' ? 'Плохо и на train, и на test — модели не хватает сложности или признаков.' : 'Высокое качество на обеих выборках и маленький разрыв.' });
};

/* ---------- SQL ---------- */
G.joinCount = () => {
  const e = R.int(4, 9), u = R.int(1, 2), m = R.int(1, 2), d = R.int(3, 5);
  const kind = R.pick(['INNER', 'LEFT', 'RIGHT', 'FULL']);
  const res = { INNER: e - u, LEFT: e, RIGHT: e - u + m, FULL: e + m }[kind];
  return single({ topic: 'sql', text: `Таблицы: employees (${e} строк), departments (${d} строк). У каждого сотрудника не больше одного отдела. ${u} ${plural(u, 'сотрудник не привязан', 'сотрудника не привязаны', 'сотрудников не привязаны')} к отделу, и ${m} ${plural(m, 'отдел пустой', 'отдела пустые', 'отделов пустые')}. Сколько строк вернёт employees ${kind} JOIN departments?`,
    correct: res, wrong: [e - u, e, e - u + m, e + m, e + d, e * d].filter(x => x !== res),
    expl: `Совпадений: ${e - u}. INNER = ${e - u}; LEFT = все сотрудники = ${e}; RIGHT = ${e - u} + пустые отделы ${m} = ${e - u + m}; FULL = ${e - u} + ${u} + ${m} = ${e + m}. Ответ для ${kind}: <b>${res}</b>.`, time: 90 });

<tr><td>Отвергли H₀</td><td><b>Ошибка I рода</b>, вероятность α</td><td>Верно, вероятность 1 − β (мощность)</td></tr>
<tr><td>Не отвергли H₀</td><td>Верно</td><td><b>Ошибка II рода</b>, вероятность β</td></tr></table>
<ul><li>α = 0,05 — вероятность отклонить верную H₀.</li><li>«Признали успешным, а эффекта нет» — ошибка I рода.</li><li>«Пропустили реальный эффект» — ошибка II рода.</li></ul>
<h3>p-value</h3>
<p>Вероятность получить такой или более экстремальный результат, <b>если H₀ верна</b>. Это не вероятность того, что H₀ верна, и не «вероятность ошибки».</p>
<div class="formula">p &lt; α → отвергаем H₀ (эффект значим) · p ≥ α → не отвергаем</div>
<p class="ex">p = 0,08 при α = 0,05 → нет статистически значимого эффекта. Это не доказывает, что эффекта нет.</p>
<h3>Мощность</h3>
<p>Мощность = 1 − β. Растёт с размером выборки, размером эффекта, уровнем α; падает с дисперсией и при более строгом α. У разных критериев при одном α мощность может отличаться.</p>
<div class="formula">n на группу ≈ 16σ² / δ² (α = 0,05, мощность 80%)</div>
<h3>Практика A/B</h3>
<ul><li>Доли (конверсия, CTR) — z-тест или χ². Средние (чек) — t-тест Уэлча, бутстреп.</li><li>Подглядывание: остановка при первом p &lt; 0,05 раздувает ошибку I рода.</li><li>SRM: группы не в заданной пропорции → баг сплита, результатам не верить.</li><li>Множественные сравнения: k метрик → в среднем k · α ложных срабатываний. Бонферрони: α / k.</li><li>Guardrail-метрики: проверяют, что не сломали другое.</li></ul>`
  },
  ml: {
    lead: 'Задачи 18–21. Выбор модели, переобучение, метрики классификации.',
    html: `
<h3>Матрица ошибок</h3>
<table class="mini"><tr><th></th><th>Реально 1</th><th>Реально 0</th></tr><tr><td>Предсказали 1</td><td>TP</td><td>FP</td></tr><tr><td>Предсказали 0</td><td>FN</td><td>TN</td></tr></table>
<div class="formula">Precision = TP/(TP+FP) · Recall = TP/(TP+FN) · Accuracy = (TP+TN)/всего · F1 = 2PR/(P+R)</div>
<p class="ex">«Болен» у 6, из них больны 4; «не болен» у 14, из них больны 2 → TP 4, FP 2, FN 2, TN 12. P = R = 0,667, A = 0,8.</p>
<h3>Какую метрику выбрать</h3>
<ul><li>Опасны пропуски (медицина, фрод) → Recall.</li><li>Опасны ложные тревоги (спам, блокировки) → Precision.</li><li>Нужен баланс → F1. Ранжирование без порога → ROC-AUC.</li><li>Сильный дисбаланс → accuracy обманывает.</li><li>Регрессия: MAE устойчивее к выбросам, RMSE сильнее штрафует крупные ошибки.</li></ul>
<h3>Переобучение и недообучение</h3>
<p>Train 98%, test 60% → переобучение. Плохо и там, и там → недообучение. Лечение переобучения: регуляризация, проще модель, больше данных, кросс-валидация.</p>
<h3>Выбор модели</h3>
<ul><li>Быстро оценить зависимость числа от признаков → линейная регрессия.</li><li>Бинарный исход с интерпретацией → логистическая регрессия.</li><li>Нет меток, нужны сегменты → K-means.</li><li>Визуализация многомерных данных → t-SNE, PCA.</li><li>KNN требует масштабирования признаков, деревья — нет.</li></ul>`
  },

<h3>Порядок выполнения</h3>
<div class="formula">FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT</div>
<h3>Агрегаты</h3>
<ul><li>Неагрегированный столбец в SELECT обязан быть в GROUP BY. Вариант без GROUP BY при «для каждого» — сразу мимо.</li><li>COUNT(*) — все строки; COUNT(col) — без NULL; COUNT(DISTINCT col) — уникальные.</li><li>WHERE — фильтр строк, HAVING — фильтр групп.</li><li>Сравнение с NULL: только IS NULL / IS NOT NULL.</li></ul>
<h3>JOIN: сколько строк</h3>
<table class="mini"><tr><th>JOIN</th><th>Что вернёт</th><th>4 сотрудника (1 без отдела), 3 отдела (1 пустой)</th></tr>
<tr><td>INNER</td><td>только совпадения</td><td>3</td></tr><tr><td>LEFT</td><td>все слева</td><td>4</td></tr><tr><td>RIGHT</td><td>все справа</td><td>4</td></tr><tr><td>FULL</td><td>совпадения + все несовпавшие</td><td>5</td></tr></table>
<h3>Оконные функции</h3>
<pre class="code">AVG(salary) OVER (PARTITION BY dept_id)
ROW_NUMBER() OVER (PARTITION BY product ORDER BY amount DESC)</pre>
<p>Окно не схлопывает строки — это аналог transform в pandas.</p>`
  },
  py: {

<h3>Ловушки синтаксиса</h3>
<ul><li><code>%</code> — остаток, <code>//</code> — целая часть (округление вниз: −7 // 2 = −4).</li><li><code>range(1, 6)</code> — это 1…5, правая граница не входит. «От 1 до 5» → range(1, 6).</li><li><code>round(2.5) == 2</code> — округление к чётному.</li><li>Срез <code>s[1:4]</code> — индексы 1, 2, 3.</li></ul>

<script>
/* ================= state ================= */
const KEY = 'avito-trainer-v1';
function loadState() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
const S = Object.assign({ stats: {}, mistakes: [], days: {}, exams: [], sqlDone: {}, pyDone: {}, code: {}, sqlCode: {} }, loadState());
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
function record(topic, ok, secs) {
  (S.stats[topic] = S.stats[topic] || []).push({ ok: ok ? 1 : 0, t: Math.round(secs) });
  if (S.stats[topic].length > 40) S.stats[topic] = S.stats[topic].slice(-40);
  save();
}
function topicStat(t) {
  const a = (S.stats[t] || []).slice(-20);
  if (!a.length) return { n: 0, acc: 0, time: 0, total: (S.stats[t] || []).length };
  return { n: a.length, acc: a.reduce((s, x) => s + x.ok, 0) / a.length, time: a.reduce((s, x) => s + x.t, 0) / a.length, total: (S.stats[t] || []).length };
}
function topicState(t) {
  const st = topicStat(t);
  if (st.n === 0) return { cls: 'idle', label: 'не начато' };
  if (st.n >= 15 && st.acc >= 0.85) return { cls: 'good', label: 'готово' };
  if (st.acc >= 0.7) return { cls: 'mid', label: 'почти' };
  return { cls: 'bad', label: 'тренировать' };
}
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const mmss = s => { const neg = s < 0; s = Math.abs(Math.round(s)); return (neg ? '+' : '') + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

/* ================= navigation ================= */
const VIEWS = ['plan', 'theory', 'train', 'exam', 'sql', 'python'];
let activeTimer = null;
function stopTimer() { if (activeTimer) { clearInterval(activeTimer); activeTimer = null; } }
function go(view, opts = {}) {
  if (!VIEWS.includes(view)) view = 'plan';
  if (view !== 'exam' && EX.running) { EX.pendingNav = { view, opts }; showExamLeave(); return; }

  $$('main > section').forEach(s => { s.hidden = s.id !== 'v-' + view; });
  ({ plan: renderPlan, theory: renderTheory, train: renderTrain, exam: renderExam, sql: renderSql, python: renderPython })[view](opts);
  window.scrollTo(0, 0);
}

  { id: 'd1', dates: '25–26 окт', title: 'Вероятность и комбинаторика', topics: ['logic', 'prob', 'comb'], goal: 'По 15+ задач в каждой теме, точность от 85%, в среднем меньше минуты на задачу.' },

  { id: 'd4', dates: '31 окт', title: 'Основы ML', topics: ['ml'], goal: 'Матрицу ошибок из текстового условия строишь за минуту.' },

];

      <div class="cd"><span class="num">${tl > 0 ? tl : 0}</span><span class="lbl">${plural(Math.max(tl, 0), 'день', 'дня', 'дней')} до теста · ~6 ноя</span></div>

  <div class="topics">
    ${Object.entries(TOPICS).map(([t, v]) => { const st = topicStat(t), s = topicState(t); return `

        <span class="t-meta">${st.n ? `${Math.round(st.acc * 100)}% верно · ${Math.round(st.time)} с/задача · ${st.total} всего` : 'ещё нет ответов'}</span>

  </div>

  <h2 class="sec">План по дням</h2>

          <div class="row gap wrap">
            ${d.topics.map(t => `<button class="btn sm" data-go="train" data-topic="${t}">${TOPICS[t].name}</button>`).join('')}

            ${d.extra === 'sql' ? `<button class="btn sm" data-go="sql">SQL-песочница · ${Object.keys(S.sqlDone).length}/${SQLDATA.tasks.length}</button>` : ''}
            ${d.extra === 'python' ? `<button class="btn sm" data-go="python">Задачи на код · ${Object.keys(S.pyDone).length}/${CODE_TASKS.length}</button>` : ''}

  <div class="reset"><button class="link" id="reset-btn">Сбросить прогресс</button><span id="reset-confirm" hidden> Удалить все ответы и историю? <button class="link danger" id="reset-yes">Да, сбросить</button> <button class="link" id="reset-no">Отмена</button></span></div>`;
  $$('[data-day]', el).forEach(c => c.addEventListener('change', () => { S.days[c.dataset.day] = c.checked; if (!c.checked) delete S.days[c.dataset.day]; save(); renderPlan(); }));
  $('#reset-btn').onclick = () => { $('#reset-confirm').hidden = false; };

/* ================= question card ================= */
function questionCard(q, { label, onAnswer, mode }) {
  const wrap = document.createElement('div');
  wrap.className = 'qcard';
  const multi = q.kind === 'multi';
  wrap.innerHTML = `
    <div class="qbar"><span class="qlabel">${label}</span><span class="timer" aria-live="off">${mmss(q.time)}</span></div>
    <div class="qgrid">

        ${q.html || ''}
      </div>
      <div class="qopts">
        <p class="olabel">${multi ? 'Выберите все верные варианты' : 'Выберите один вариант'}</p>
        <div class="opts" role="${multi ? 'group' : 'radiogroup'}">
          ${q.options.map((o, i) => `<label class="opt ${q.code ? 'code' : ''}"><input type="${multi ? 'checkbox' : 'radio'}" name="opt" value="${i}"><span class="key">${i + 1}</span><span class="otext">${esc(o)}</span></label>`).join('')}
        </div>
        <div class="row gap qactions"><button class="btn primary submit" disabled>Ответить</button><span class="hint">Клавиши 1–${q.options.length} и Enter</span></div>
        <div class="feedback" hidden></div>
      </div>
    </div>`;
  const t0 = performance.now();
  let answered = false;
  const timerEl = $('.timer', wrap), submit = $('.submit', wrap);
  const inputs = $$('input', wrap);
  inputs.forEach(i => i.addEventListener('change', () => { submit.disabled = !inputs.some(x => x.checked); }));
  function finish(timeout) {
    if (answered) return; answered = true; stopTimer();
    const secs = (performance.now() - t0) / 1000;
    const chosen = inputs.filter(i => i.checked).map(i => +i.value);
    const ok = chosen.length === q.correct.length && chosen.every(c => q.correct.includes(c));
    inputs.forEach(i => { i.disabled = true; const lab = i.closest('.opt'); const v = +i.value; if (q.correct.includes(v)) lab.classList.add('right'); else if (i.checked) lab.classList.add('wrong'); });
    submit.hidden = true; $('.hint', wrap).hidden = true;

      const fb = $('.feedback', wrap); fb.hidden = false;

      $('.next', fb).focus();
    }
    onAnswer({ ok, chosen, secs, timeout: !!timeout, wrap });
  }
  submit.onclick = () => finish(false);
  wrap.finish = finish;

    if (!S.mistakes.length) { host.innerHTML = '<div class="empty"><p>Ошибок для разбора нет. Они появятся здесь после неверных ответов в тренировке и пробном тесте.</p><button class="btn primary" data-go="train" data-topic="all">Тренировать все темы</button></div>'; return; }
    q = JSON.parse(JSON.stringify(S.mistakes[0]));

    q = genTopic(t);
  }
  const card = questionCard(q, { label: TR.topic === 'mistakes' ? `Ошибка 1 из ${S.mistakes.length}` : `Задача ${TR.n + 1}`, mode: 'train', onAnswer: ({ ok, secs, wrap }) => {
    TR.n++; if (ok) { TR.ok++; TR.streak++; } else TR.streak = 0;
    record(q.topic, ok, secs);

    $('.session', document).innerHTML = `<span>Сессия: <b>${TR.ok}/${TR.n}</b> верно</span><span>Серия: <b>${TR.streak}</b></span>`;

function addMistake(q) { S.mistakes = S.mistakes.filter(m => m.text !== q.text || m.html !== q.html); S.mistakes.push(q); if (S.mistakes.length > 60) S.mistakes.shift(); save(); }
function weightedTopic() {
  const ts = Object.keys(TOPICS);
  const w = ts.map(t => { const st = topicStat(t); return st.n < 5 ? 3 : 1 + 3 * (1 - st.acc); });
  let r = Math.random() * w.reduce((a, b) => a + b);
  for (let i = 0; i < ts.length; i++) { r -= w[i]; if (r <= 0) return ts[i]; }
  return ts[0];
}

let SQLlib = null, sqlTask = SQLDATA.tasks[0].id;
async function ensureSql() { if (!SQLlib) { for (const s of LIBS.sql) await loadScript(s); SQLlib = await window.initSqlJs(); } return SQLlib; }
function freshDb() { const db = new SQLlib.Database(); db.run(SQLDATA.ddl); return db; }
function lastResult(db, sql) { const r = db.exec(sql); return r.length ? r[r.length - 1] : { columns: [], values: [] }; }
function normRow(row) { return row.map(v => v === null ? 'NULL' : typeof v === 'number' ? String(Math.round(v * 1e4) / 1e4) : String(v)).join('\u0001'); }
function sameResult(a, b, ordered) {
  if (a.values.length !== b.values.length) return 'Неверное число строк: ' + a.values.length + ' вместо ' + b.values.length + '.';
  if ((a.columns.length || 0) !== (b.columns.length || 0) && b.values.length) return 'Неверное число столбцов: ' + a.columns.length + ' вместо ' + b.columns.length + '.';
  const ra = a.values.map(normRow), rb = b.values.map(normRow);
  if (!ordered) { ra.sort(); rb.sort(); }
  for (let i = 0; i < ra.length; i++) if (ra[i] !== rb[i]) return ordered ? 'Строки совпадают не полностью или стоят в другом порядке.' : 'Значения в строках не совпадают с ожидаемыми.';
  return '';
}
function tableHtml(r, limit = 50) {
  if (!r.columns.length) return '<p class="muted">Запрос выполнен, строк нет.</p>';
  return `<div class="tablewrap"><table class="data"><tr>${r.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${r.values.slice(0, limit).map(row => `<tr>${row.map(v => `<td>${v === null ? '<span class="muted">NULL</span>' : esc(v)}</td>`).join('')}</tr>`).join('')}</table></div>${r.values.length > limit ? `<p class="muted">Показаны ${limit} из ${r.values.length} строк.</p>` : `<p class="muted">${r.values.length} ${plural(r.values.length, 'строка', 'строки', 'строк')}</p>`}`;
}

  $('#exam-quit').onclick = () => { EX.pendingNav = null; showExamLeave(); };
  $('#leave-no').onclick = () => { $('#exam-leave').hidden = true; EX.pendingNav = null; };
  $('#leave-yes').onclick = () => { EX.running = false; stopTimer(); const p = EX.pendingNav; EX.pendingNav = null; if (p) go(p.view, p.opts); else renderExam(); };
}
function showExamItem() {
  const el = $('#v-exam');
  if (EX.i >= EX.items.length) return finishExam();
  const it = EX.items[EX.i];
  el.innerHTML = examProgress() + '<div id="ehost"></div>';
  bindLeave();
  const host = $('#ehost');
  const advance = () => { EX.i++; showExamItem(); };
  const card = questionCard(it, { label: `Задание ${EX.i + 1} из 30`, mode: 'exam', onAnswer: ({ ok, chosen, secs, timeout }) => {
    EX.results.push({ q: it, ok, chosen, secs, timeout });
    record(it.topic, ok, secs);
    if (!ok) addMistake(it);
    setTimeout(advance, timeout ? 600 : 250);
  } });
  $('.submit', card).textContent = 'Отправить ответ';
  host.appendChild(card); currentCard = card;
}
function finishExam() {
  EX.running = false; stopTimer(); currentCard = null;
  const secs = (performance.now() - EX.t0) / 1000;
  const score = EX.results.filter(r => r.ok).length;
  const blocks = EXAM_BLOCKS.map(b => EX.results.slice(b.from, b.to + 1).filter(r => r.ok).length);
  const d = new Date();
  S.exams.push({ date: d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }), score, secs: Math.round(secs), blocks });
  if (S.exams.length > 30) S.exams.shift();
  save();
  const el = $('#v-exam');
  const verdict = score >= 27 ? 'Уровень цели — можно идти на тест.' : score >= 22 ? 'Близко к цели. Добери слабые блоки и повтори через день.' : 'Пока рано: пройди тренировки по слабым темам и повтори пробный тест.';
  el.innerHTML = `
    <div class="examres">
      <p class="eyebrow">Результат пробного теста</p>
      <div class="score"><span class="big">${score}</span><span class="of">/ 30</span></div>
      <p class="lead">${verdict} Время: ${mmss(secs)}.</p>
      <div class="tablewrap"><table class="data"><tr><th>Блок</th><th>Верно</th><th></th></tr>${EXAM_BLOCKS.map((b, i) => { const n = b.to - b.from + 1, r = blocks[i] / n; return `<tr><td>${b.name}</td><td>${blocks[i]}/${n}</td><td class="barcell"><span class="bar"><span class="${r >= 0.85 ? 'good' : r >= 0.7 ? 'mid' : 'bad'}" style="width:${r * 100}%"></span></span></td></tr>`; }).join('')}</table></div>
      <div class="row gap wrap"><button class="btn primary" id="exam-again">Пройти ещё раз</button><button class="btn" data-go="train" data-topic="mistakes">Разобрать ошибки</button><button class="btn ghost" data-go="plan">К плану</button></div>
      <h3 class="sec">Разбор</h3>
      <ol class="review">${EX.results.map((r, i) => r.code ? `
        <li class="${r.ok ? 'ok' : 'no'}"><details><summary><span class="rnum">${i + 1}</span> ${r.ok ? 'Верно' : 'Неверно'} · Код: ${esc(r.code.title)} · тесты ${r.passed}/${r.total} · ${Math.round(r.secs)} с</summary>
        <p class="olabel">Ваш код</p><pre class="code">${esc(r.src)}</pre><p class="olabel">Эталон</p><pre class="code">${esc(r.code.ref_py || r.code.ref)}</pre></details></li>` : `
        <li class="${r.ok ? 'ok' : 'no'}"><details><summary><span class="rnum">${i + 1}</span> ${r.ok ? 'Верно' : r.timeout ? 'Время вышло' : 'Неверно'} · ${esc(r.q.text.length > 90 ? r.q.text.slice(0, 90) + '…' : r.q.text)} · ${Math.round(r.secs)} с</summary>
        ${r.q.html || ''}<ul class="ans">${r.q.options.map((o, k) => `<li class="${r.q.correct.includes(k) ? 'right' : r.chosen.includes(k) ? 'wrong' : ''}">${esc(o)}${r.chosen.includes(k) ? ' <span class="muted">· ваш ответ</span>' : ''}</li>`).join('')}</ul><div class="expl">${r.q.expl}</div></details></li>`).join('')}</ol>
    </div>`;
  $('#exam-again').onclick = () => renderExam();
}

/* ================= boot ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (!b) return;
  e.preventDefault();
  go(b.dataset.go, { topic: b.dataset.topic });
});
$$('.nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
go((location.hash || '').replace('#', '') || 'plan');

</script>
